<!-- ========================================================
     1. SPARK AI FOR SPARKOS FOUNDERS EDITION (sparkos_founders.html)
     ======================================================== -->
<style>
/* Spark AI Floating Glass Assistant · Founders Edition */
.ai-overlay {
    position: fixed; inset: 0; z-index: 8800;
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 17vh; background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 0; visibility: hidden; transition: opacity 0.22s ease, visibility 0.22s;
}
.ai-overlay.open { opacity: 1; visibility: visible; }
.ai-card {
    position: relative; width: min(640px, 92vw); border-radius: 24px;
    background: rgba(24, 27, 42, 0.84);
    backdrop-filter: blur(45px) saturate(210%); -webkit-backdrop-filter: blur(45px) saturate(210%);
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow: 0 35px 90px rgba(0, 0, 0, 0.65), 0 0 55px rgba(245, 192, 74, 0.28);
    overflow: hidden; transform: translateY(-12px) scale(0.97);
    transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
}
.ai-overlay.open .ai-card { transform: none; }
.ai-card::before {
    content: ''; position: absolute; inset: -2px; border-radius: inherit; padding: 2px;
    background: linear-gradient(135deg, #f5c04a, #ec4899, #8b5cf6, #38bdf8, #10b981, #f5c04a);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: 0.85; animation: aiGlowRotate 5s linear infinite; pointer-events: none;
}
@keyframes aiGlowRotate { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
.ai-input-row { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
.ai-orb {
    width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff, #f5c04a 45%, #7c3aed 85%);
    box-shadow: 0 0 16px rgba(245, 192, 74, 0.7); flex: none; animation: orbPulse 2.5s ease-in-out infinite;
}
@keyframes orbPulse { 0%, 100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.1); filter: brightness(1.25); } }
.ai-input { flex: 1; background: none; border: none; outline: none; color: #fff; font-size: 16px; font-family: inherit; user-select: text; }
.ai-input::placeholder { color: rgba(255, 255, 255, 0.45); }
.ai-body { max-height: 380px; overflow-y: auto; padding: 18px 22px; font-size: 14px; line-height: 1.6; color: rgba(255, 255, 255, 0.94); display: none; }
.ai-body.show { display: block; }
.ai-response { white-space: pre-wrap; word-break: break-word; user-select: text; }
.ai-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
.ai-chip {
    background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 12px; padding: 5px 12px; font-size: 12px; font-weight: 500; color: #fff;
    cursor: pointer; transition: all 0.15s ease;
}
.ai-chip:hover { background: rgba(124, 58, 237, 0.85); box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4); }
.ai-foot {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 20px; font-size: 11px; color: rgba(255, 255, 255, 0.45);
    background: rgba(0, 0, 0, 0.22); border-top: 1px solid rgba(255, 255, 255, 0.06);
}
.ai-foot kbd { font-size: 10px; padding: 1px 5px; }
</style>

<!-- HTML Modal -->
<div class="ai-overlay" id="aiOverlay" onclick="closeAi()">
    <div class="ai-card" onclick="event.stopPropagation()">
        <div class="ai-input-row">
            <div class="ai-orb"></div>
            <input type="text" class="ai-input" id="aiInput" placeholder="Ask Spark AI, or control your desktop..." autocomplete="off" onkeydown="handleAiKey(event)">
            <button type="button" class="s-btn" id="aiKeyBtn" onclick="promptAiApiKey()" title="Set Gemini API Key" style="font-size:11px; padding:4px 9px;">API Key</button>
        </div>
        <div class="ai-body" id="aiBody">
            <div class="ai-response" id="aiResponse"></div>
            <div class="ai-actions" id="aiActions">
                <button type="button" class="ai-chip" onclick="askAiPreset('Summarize my notes')">📝 Summarize Notes</button>
                <button type="button" class="ai-chip" onclick="askAiPreset('What are my remaining tasks?')">✅ Check To-dos</button>
                <button type="button" class="ai-chip" onclick="askAiPreset('Give me 3 creative diary writing prompts')">📖 Diary Ideas</button>
                <button type="button" class="ai-chip" onclick="askAiPreset('timer 25')">⏱️ 25m Focus Timer</button>
                <button type="button" class="ai-chip" onclick="askAiPreset('rain')">🌧️ Rain Ambience</button>
            </div>
        </div>
        <div class="ai-foot">
            <span>Spark AI · Founders Edition</span>
            <span><kbd>↵</kbd> run · <kbd>esc</kbd> close</span>
        </div>
    </div>
</div>

<script>
// Spark AI JavaScript Controller
const AI_KEY_STORAGE = 'sparkos_gemini_api_key';
function openAi() {
    if (typeof closePalette === 'function') closePalette();
    if (typeof closeSettings === 'function') closeSettings();
    const overlay = document.getElementById('aiOverlay'), inp = document.getElementById('aiInput');
    const body = document.getElementById('aiBody'), resp = document.getElementById('aiResponse');
    if (!overlay || !inp) return;
    overlay.classList.add('open');
    if (!resp.textContent.trim()) {
        body.classList.add('show');
        resp.innerHTML = '<div style="color:rgba(255,255,255,0.7);font-size:13px">✨ Welcome to <b>Spark AI</b>. Type any question, task, or OS command below (e.g. <i>"timer 25"</i>, <i>"rain"</i>, <i>"todo buy milk"</i>, or ask anything).</div>';
    }
    setTimeout(() => inp.focus(), 60);
    if (typeof blip === 'function') blip(600, 0.05);
}
function closeAi() {
    const overlay = document.getElementById('aiOverlay');
    if (overlay && overlay.classList.contains('open')) {
        overlay.classList.remove('open');
        const omni = document.getElementById('omnibar');
        if (omni) omni.focus();
    }
}
function promptAiApiKey() {
    const cur = localStorage.getItem(AI_KEY_STORAGE) || '';
    const key = prompt('Enter your free Google Gemini API Key:\n(Leave blank to use offline mode. Get a free key at aistudio.google.com)', cur);
    if (key === null) return;
    if (key.trim()) { localStorage.setItem(AI_KEY_STORAGE, key.trim()); if(typeof toast==='function') toast('Gemini API key saved!'); }
    else { localStorage.removeItem(AI_KEY_STORAGE); if(typeof toast==='function') toast('Gemini API key cleared (using built-in assistant)'); }
}
function askAiPreset(txt) {
    const inp = document.getElementById('aiInput');
    if (inp) { inp.value = txt; runAiQuery(txt); }
}
function handleAiKey(e) {
    if (e.key === 'Escape') { closeAi(); return; }
    if (e.key === 'Enter') { e.preventDefault(); const val = e.target.value.trim(); if (val) runAiQuery(val); }
}
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeAi();
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); openAi(); }
});
async function runAiQuery(prompt) {
    const body = document.getElementById('aiBody'), resp = document.getElementById('aiResponse'), inp = document.getElementById('aiInput');
    if (!prompt || !resp) return;
    body.classList.add('show');
    resp.innerHTML = '<span style="color:#f5c04a;animation:pulse 1.2s infinite">✦ Thinking…</span>';
    const lower = prompt.toLowerCase().trim();
    const timerMatch = lower.match(/^timer\s+(\d+)/);
    if (timerMatch) {
        const mins = parseInt(timerMatch[1], 10);
        if (typeof timerSet === 'function') { timerSet(mins); timerToggle(); }
        resp.innerHTML = `⏱️ <b>Focus Timer started:</b> ${mins} minutes countdown active.`;
        inp.value = ''; return;
    }
    const todoMatch = lower.match(/^todo\s+(.+)/);
    if (todoMatch && typeof todos !== 'undefined') {
        todos.unshift({ t: todoMatch[1].trim(), d: false });
        if (typeof saveTodos === 'function') saveTodos();
        if (typeof renderTodos === 'function') renderTodos();
        resp.innerHTML = `✅ <b>Added to your to-do list:</b> "${todoMatch[1].trim()}"`;
        inp.value = ''; return;
    }
    const apiKey = localStorage.getItem(AI_KEY_STORAGE);
    if (apiKey) {
        try {
            const systemPrompt = `You are Spark AI, the intelligent built-in desktop assistant for SparkOS (Founders Edition). Be concise, helpful, friendly, and direct.`;
            const payload = { contents: [{ role: 'user', parts: [{ text: `${systemPrompt}\n\nUser request: ${prompt}` }] }], generationConfig: { temperature: 0.7, maxOutputTokens: 600 } };
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                resp.innerText = data.candidates[0].content.parts.map(p => p.text).join('\n');
                inp.value = ''; return;
            }
        } catch (err) { console.warn(err); }
    }
    if (window.ai && window.ai.languageModel) {
        try { const s = await window.ai.languageModel.create(); resp.innerText = await s.prompt(prompt); inp.value = ''; return; } catch(e){}
    }
    resp.innerHTML = `✦ <b>Spark AI:</b> Query received: "<i>${prompt}</i>". Set your free Gemini API key using the <b>API Key</b> button above for full generative answers!`;
    inp.value = '';
}
</script>
